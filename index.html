const CONTENT={"ru-privacy": "<main><h1>Политика конфиденциальности<\/h1><p class=\"meta\">Приложение: PhotoPDF · Пакет Android: <code>com.photopdf.app<\/code> · Дата вступления в силу: 15 октября 2026 г.<\/p><div class=\"note\"><strong>Перед публикацией:<\/strong> замените <code>YOUR_CONTACT_EMAIL@example.com<\/code> на действующий адрес разработчика и проверьте документ на соответствие опубликованной версии приложения.<\/div>\n<h2>1. Кто отвечает за обработку данных<\/h2><p>Оператор приложения PhotoPDF: <strong>[укажите имя разработчика или юридическое лицо]<\/strong>. Контакт для обращений по вопросам конфиденциальности: <a href=\"mailto:YOUR_CONTACT_EMAIL@example.com\">YOUR_CONTACT_EMAIL@example.com<\/a>.<\/p>\n<h2>2. Какие данные обрабатывает приложение<\/h2><p>PhotoPDF позволяет выбирать изображения и PDF-файлы, получать фотографии через системное приложение камеры, обрезать и редактировать страницы, распознавать текст (OCR) и создавать PDF-документы. Для этих функций приложение обрабатывает выбранные вами изображения, текст, координаты обрезки, настройки страниц и создаваемые документы.<\/p><p>При выборе файлов используются системные механизмы Android. PhotoPDF получает доступ к файлам, которые вы выбираете, или к снимкам, которые создаёте для обработки.<\/p>\n<h2>3. Локальная обработка и OCR<\/h2><p>В рассматриваемой версии распознавание текста выполняется на устройстве с помощью встроенных OCR-моделей. Для распознавания изображений не требуется отправлять документы на сервер разработчика. Готовые PDF сохраняются в место, выбранное пользователем.<\/p><p>Если OCR не распознаёт текст или возникает ошибка, приложение может создать PDF, содержащий изображения страниц без выделяемого текстового слоя.<\/p>\n<h2>4. Интернет и веб-страницы<\/h2><p>Функция «Веб-страница в PDF» использует встроенный WebView для загрузки указанного вами сайта. При посещении сайта ваше устройство взаимодействует с его сервером; сайт может получать IP-адрес, технические сведения, cookie и другие данные согласно собственной политике. PhotoPDF не контролирует практики сторонних сайтов.<\/p><p>Встроенный WebView может сохранять данные сайта, например cookie или локальное хранилище, в пределах механизмов Android WebView.<\/p>\n<h2>5. Передача и совместное использование<\/h2><p>PhotoPDF позволяет открыть или отправить созданный PDF через выбранное вами стороннее приложение. При таком действии документ передаётся указанному приложению, и к нему применяются правила соответствующего сервиса.<\/p><p>Приложение также может вызывать системную камеру, просмотрщик PDF и интерфейс печати Android; эти компоненты могут обрабатывать данные в соответствии со своими правилами.<\/p>\n<h2>6. Реклама, аналитика и учётные записи<\/h2><p>В изученном исходном коде PhotoPDF Stage 20 не обнаружены встроенные рекламные SDK, SDK аналитики или функция регистрации учётной записи. Это описание относится к указанной версии исходников; перед публикацией новой сборки его необходимо перепроверить.<\/p>\n<h2>7. Хранение и удаление<\/h2><p>Выбранные исходные файлы обычно остаются в исходном месте. Созданные PDF сохраняются в выбранной вами папке. Временные файлы обработки могут создаваться в кэше приложения и удаляться после завершения операции; некоторые временные данные могут сохраняться до очистки кэша системой или пользователем. Снимки, сделанные через системную камеру, могут сохраняться в медиахранилище устройства.<\/p><p>Вы можете удалить сохранённые документы через файловый менеджер и очистить данные приложения через настройки Android. Удаление приложения не обязательно удаляет файлы, сохранённые вне его приватного хранилища.<\/p>\n<h2>8. Безопасность<\/h2><p>Приложение использует механизмы доступа к файлам и изоляции приложений Android. Ни одно программное обеспечение не может гарантировать абсолютную безопасность; рекомендуем защищать устройство паролем и осторожно делиться конфиденциальными документами.<\/p>\n<h2>9. Дети<\/h2><p>PhotoPDF — универсальный инструмент обработки документов и не предназначен специально для детей. Если вы считаете, что приложение обрабатывает персональные данные ребёнка ненадлежащим образом, обратитесь по контактному адресу.<\/p>\n<h2>10. Ваши права и обращения<\/h2><p>В зависимости от применимого законодательства вы можете иметь права на получение информации об обработке данных, доступ, исправление или удаление данных и подачу жалобы в надзорный орган. Для вопросов о работе приложения и обработке данных свяжитесь с разработчиком по указанному адресу.<\/p>\n<h2>11. Изменения политики<\/h2><p>Мы можем обновлять эту политику при изменении функций приложения или законодательства. Актуальная версия публикуется на этой странице с новой датой вступления в силу.<\/p><\/main>", "ru-terms": "<main><h1>Условия использования<\/h1><p class=\"meta\">Приложение: PhotoPDF · Дата вступления в силу: 15 октября 2026 г.<\/p><div class=\"note\"><strong>Перед публикацией:<\/strong> укажите разработчика и контактный адрес <code>YOUR_CONTACT_EMAIL@example.com<\/code>. Условия должны соответствовать реальным функциям опубликованной сборки.<\/div>\n<h2>1. Принятие условий<\/h2><p>Устанавливая и используя PhotoPDF, вы соглашаетесь с настоящими условиями в той мере, в какой это допускается применимым законодательством. Если вы не согласны, прекратите использование приложения.<\/p>\n<h2>2. Назначение приложения<\/h2><p>PhotoPDF предназначен для преобразования изображений в PDF, сканирования и обрезки документов, коррекции страниц, распознавания текста, а также создания PDF из веб-страниц с помощью возможностей Android. Наличие и качество отдельных функций зависит от версии приложения, устройства и исходных материалов.<\/p>\n<h2>3. Ваши файлы и права<\/h2><p>Вы сохраняете права на свои изображения, документы и создаваемые материалы. Вы обязуетесь использовать только материалы, на обработку которых у вас есть необходимые права и разрешения. Разработчик не приобретает права собственности на содержимое ваших документов вследствие их обработки в приложении.<\/p>\n<h2>4. OCR и точность документов<\/h2><p>Распознавание текста может допускать ошибки, пропускать символы и некорректно определять расположение текста. В некоторых случаях PDF будет содержать только изображения, без возможности выделять текст. Проверяйте важные документы перед отправкой, печатью или использованием в юридических, медицинских, финансовых и иных значимых целях.<\/p>\n<h2>5. Веб-сайты и сторонние сервисы<\/h2><p>При использовании функции преобразования веб-страницы вы несёте ответственность за соблюдение правил посещаемого сайта и авторских прав. Внешние сайты, системные приложения камеры, печати, просмотра и обмена файлами регулируются собственными условиями и политиками.<\/p>\n<h2>6. Допустимое использование<\/h2><p>Запрещается использовать приложение для действий, нарушающих закон, права третьих лиц или безопасность информационных систем. Не используйте приложение для несанкционированного получения или распространения чужих документов.<\/p>\n<h2>7. Доступность и обновления<\/h2><p>Разработчик может изменять, улучшать или прекращать отдельные функции. Работа приложения может зависеть от версии Android, системных компонентов и доступности внешних сайтов.<\/p>\n<h2>8. Отказ от гарантий<\/h2><p>В пределах, допускаемых законом, приложение предоставляется «как есть». Разработчик не гарантирует безошибочную работу OCR, абсолютную точность определения границ документа или совместимость каждого созданного PDF со всеми сторонними программами. Обязательные права потребителя, предусмотренные законом, сохраняются.<\/p>\n<h2>9. Ограничение ответственности<\/h2><p>В пределах, допускаемых применимым законодательством, разработчик не отвечает за косвенные убытки, возникшие вследствие ошибок распознавания, повреждения исходных данных, сбоев устройства или использования сторонних сервисов. Это положение не исключает ответственность, которую нельзя ограничить законом.<\/p>\n<h2>10. Применимое законодательство<\/h2><p>К настоящим условиям применяется законодательство, применимое к разработчику и пользователю с учётом обязательных норм о защите прав потребителей. Споры решаются в соответствии с применимым законодательством.<\/p>\n<h2>11. Контакты и изменения<\/h2><p>Разработчик: <strong>[укажите имя разработчика или юридическое лицо]<\/strong>. Контакт: <a href=\"mailto:YOUR_CONTACT_EMAIL@example.com\">YOUR_CONTACT_EMAIL@example.com<\/a>. При изменении условий обновлённая редакция и дата её вступления в силу будут размещены на этой странице.<\/p><\/main>", "en-privacy": "<main><h1>Privacy Policy<\/h1><p class=\"meta\">App: PhotoPDF · Android package: <code>com.photopdf.app<\/code> · Effective date: October 15, 2026<\/p><div class=\"note\"><strong>Before publishing:<\/strong> replace the developer name and <code>YOUR_CONTACT_EMAIL@example.com<\/code> and verify the disclosures against the released APK.<\/div>\n<h2>1. Controller and contact<\/h2><p>App developer/controller: <strong>[insert developer's legal name]<\/strong>. Privacy contact: <a href=\"mailto:YOUR_CONTACT_EMAIL@example.com\">YOUR_CONTACT_EMAIL@example.com<\/a>.<\/p>\n<h2>2. Information processed<\/h2><p>PhotoPDF processes images, documents, recognized text, crop coordinates and page settings that you choose to use for scanning, editing, OCR and PDF creation. Android system file pickers and camera intents are used to access user-selected content.<\/p>\n<h2>3. On-device OCR<\/h2><p>In the reviewed Stage 20 source code, OCR runs on the device using bundled language data. Document images do not need to be uploaded to a developer server for OCR. PDF files are saved to locations selected by the user. If OCR fails, the app may create image-only PDFs without selectable text.<\/p>\n<h2>4. Websites and internet access<\/h2><p>The web-to-PDF feature uses Android WebView to load websites you choose. Websites may receive your IP address, device/browser information and cookies and may use their own tracking technologies. Third-party sites are governed by their own privacy policies. WebView may retain cookies or site storage through Android's WebView mechanisms.<\/p>\n<h2>5. Sharing and third parties<\/h2><p>When you share, print or open a document using another app, the content is provided to the app or service you select. System camera, printing and PDF viewing components may also process content under their own terms.<\/p>\n<h2>6. Ads, analytics and accounts<\/h2><p>The reviewed Stage 20 source does not show embedded advertising SDKs, analytics SDKs or account registration. This must be rechecked for the actual release and future versions.<\/p>\n<h2>7. Retention and deletion<\/h2><p>Original files normally remain in their original locations. Exported PDFs are saved where you choose. Temporary processing files may be stored in app cache and deleted after processing or when cache is cleared. Photos captured through the system camera may remain in device media storage. Uninstalling the app may not delete files saved outside private app storage.<\/p>\n<h2>8. Security and children<\/h2><p>PhotoPDF relies on Android file-access and app-isolation mechanisms. No software can guarantee perfect security. The app is not specifically directed to children.<\/p>\n<h2>9. Your rights<\/h2><p>Depending on applicable law, you may have rights to access, correct or delete personal information and to contact a regulator. Contact the developer using the email above with privacy questions.<\/p>\n<h2>10. Updates<\/h2><p>This policy may change as the app or legal requirements change. The current version and its effective date will be published here.<\/p><\/main>", "en-terms": "<main><h1>Terms of Use<\/h1><p class=\"meta\">App: PhotoPDF · Effective date: October 15, 2026<\/p><div class=\"note\"><strong>Before publishing:<\/strong> insert the developer's legal name and <code>YOUR_CONTACT_EMAIL@example.com<\/code> and confirm the terms reflect the released app.<\/div>\n<h2>1. Acceptance<\/h2><p>By installing or using PhotoPDF, you agree to these terms to the extent permitted by applicable law. If you disagree, stop using the app.<\/p>\n<h2>2. Service<\/h2><p>PhotoPDF provides image-to-PDF conversion, document cropping and adjustment, OCR, and web-to-PDF functionality using Android features. Availability and quality depend on the app version, device and source material.<\/p>\n<h2>3. Your content<\/h2><p>You retain ownership of your documents and images. You are responsible for having the necessary rights to process or share them. The developer does not obtain ownership of your documents merely because you process them in the app.<\/p>\n<h2>4. OCR accuracy<\/h2><p>OCR may misrecognize, omit or misplace text. Some generated PDFs may be image-only, with no selectable text. Check important files before relying on them for legal, medical, financial or other consequential purposes.<\/p>\n<h2>5. Third-party services<\/h2><p>You are responsible for complying with the rules and copyrights of websites converted to PDF. Websites and third-party camera, print, viewer and sharing apps have their own terms and policies.<\/p>\n<h2>6. Acceptable use<\/h2><p>Do not use the app unlawfully, infringe others' rights, or process and distribute documents without authorization.<\/p>\n<h2>7. Changes and availability<\/h2><p>Features may be modified or discontinued. Compatibility may depend on Android versions, system components and third-party websites.<\/p>\n<h2>8. Disclaimer<\/h2><p>To the extent allowed by law, the app is provided “as is” without guarantees of error-free OCR, perfect edge detection or compatibility with every PDF reader. Mandatory consumer rights remain unaffected.<\/p>\n<h2>9. Liability<\/h2><p>To the extent permitted by applicable law, the developer is not liable for indirect losses from recognition errors, device failures, data damage or third-party services. Liability that cannot legally be excluded remains unaffected.<\/p>\n<h2>10. Governing law<\/h2><p>Applicable law, including mandatory consumer protections, governs these terms and related disputes.<\/p>\n<h2>11. Contact and changes<\/h2><p>Developer: <strong>[insert developer's legal name]<\/strong>. Email: <a href=\"mailto:YOUR_CONTACT_EMAIL@example.com\">YOUR_CONTACT_EMAIL@example.com<\/a>. Updated terms and their effective date will be posted here.<\/p><\/main>", "zh-privacy": "<main><h1>隐私政策<\/h1><p class=\"meta\">应用：PhotoPDF · Android 应用包名：<code>com.photopdf.app<\/code> · 生效日期：2026年10月15日<\/p><div class=\"note\"><strong>发布前请注意：<\/strong>请将 <code>YOUR_CONTACT_EMAIL@example.com<\/code> 和开发者名称替换为真实信息，并核对本政策是否与正式发布版本的实际行为一致。<\/div>\n<h2>1. 开发者及联系方式<\/h2><p>PhotoPDF 应用的开发者及个人信息处理责任方：<strong>[填写开发者姓名或公司法定名称]<\/strong>。隐私问题请联系：<a href=\"mailto:YOUR_CONTACT_EMAIL@example.com\">YOUR_CONTACT_EMAIL@example.com<\/a>。<\/p>\n<h2>2. 应用处理哪些信息<\/h2><p>PhotoPDF 可将照片和图片转换为 PDF、扫描文档、裁剪及校正页面、识别文字（OCR），并生成 PDF 文件。为了提供这些功能，应用会在设备上处理您选择的图片、文档、识别出的文字、裁剪坐标和页面设置。<\/p><p>应用通过 Android 系统文件选择器或相机功能访问您主动选择或拍摄的内容。<\/p>\n<h2>3. 本地处理与 OCR<\/h2><p>在所审查的 Stage 20 源代码版本中，OCR 使用随应用提供的语言模型在设备本地运行，无需将文档图片上传至开发者服务器进行文字识别。生成的 PDF 保存到您选择的位置。<\/p><p>如果文字识别失败或出现错误，应用可能生成仅包含页面图片的 PDF；此类 PDF 中的文字可能无法直接选择或复制。<\/p>\n<h2>4. 网络及网页转 PDF<\/h2><p>“网页转 PDF”功能通过 Android WebView 加载您指定的网站。访问第三方网站时，该网站可能接收您的 IP 地址、浏览器及设备技术信息、Cookie 等数据，并按照其自身的隐私政策进行处理。PhotoPDF 无法控制第三方网站的数据处理方式。<\/p><p>Android WebView 可能依据系统机制保存 Cookie 或网站本地存储数据。<\/p>\n<h2>5. 文件分享及第三方应用<\/h2><p>如果您选择使用其他应用打开、打印或分享生成的 PDF，相关文档会提供给您所选择的应用或服务。系统相机、打印组件和 PDF 阅读器也可能依据其各自的规则处理相关内容。<\/p>\n<h2>6. 广告、分析及账户<\/h2><p>在所审查的 PhotoPDF Stage 20 源代码中，未发现集成的广告 SDK、分析 SDK 或账户注册功能。正式发布前及每次版本更新时，应重新核实此项说明。<\/p>\n<h2>7. 保存期限及删除方式<\/h2><p>原始图片和文档通常保留在其原有位置；导出的 PDF 保存在您选择的文件夹。处理过程中可能在应用缓存中生成临时文件，这些文件可在处理完成后删除，或在清除缓存时由系统或用户删除。通过系统相机拍摄的照片可能保留在设备媒体存储中。<\/p><p>您可以使用文件管理器删除已导出的文档，也可以在 Android 设置中清除应用数据。卸载应用不一定会删除保存在应用私有存储空间之外的文件。<\/p>\n<h2>8. 安全措施<\/h2><p>PhotoPDF 使用 Android 提供的文件访问及应用隔离机制。任何软件都无法保证绝对安全；建议您为设备设置锁屏保护，并谨慎分享敏感文档。<\/p>\n<h2>9. 儿童隐私<\/h2><p>PhotoPDF 是通用文档处理工具，并非专门面向儿童设计。如您对儿童个人信息处理有疑问，请通过上述邮箱联系开发者。<\/p>\n<h2>10. 您的权利<\/h2><p>根据适用法律，您可能享有了解、访问、更正、删除个人信息及向监管机构投诉等权利。如需咨询，请联系上述邮箱。<\/p>\n<h2>11. 政策更新<\/h2><p>应用功能或法律要求发生变化时，我们可能更新本政策。最新版本及生效日期将在本页面公布。<\/p><\/main>", "zh-terms": "<main><h1>使用条款<\/h1><p class=\"meta\">应用：PhotoPDF · 生效日期：2026年10月15日<\/p><div class=\"note\"><strong>发布前请注意：<\/strong>请填写开发者法定名称及有效联系邮箱 <code>YOUR_CONTACT_EMAIL@example.com<\/code>，并确认条款与正式发布版本的功能一致。<\/div>\n<h2>1. 接受条款<\/h2><p>在适用法律允许的范围内，安装或使用 PhotoPDF 即表示您同意本使用条款。如不同意，请停止使用本应用。<\/p>\n<h2>2. 应用功能<\/h2><p>PhotoPDF 提供图片转 PDF、文档扫描与裁剪、页面调整、文字识别（OCR），以及通过 Android 功能将网页转换为 PDF 等工具。具体功能和效果可能因应用版本、设备及原始材料而异。<\/p>\n<h2>3. 您的文档及权利<\/h2><p>您保留对自己图片和文档的所有权利。您应确保拥有处理、复制或分享相关材料所需的权利和许可。开发者不会仅因您使用本应用处理文件而取得这些文件的所有权。<\/p>\n<h2>4. OCR 准确性<\/h2><p>文字识别可能出现错字、漏字或文字位置偏差。部分生成的 PDF 可能只包含图片，无法直接选择其中的文字。对于法律、医疗、财务或其他重要用途，请在使用、发送或打印前自行核对文件内容。<\/p>\n<h2>5. 第三方网站与服务<\/h2><p>使用网页转 PDF 功能时，您有责任遵守目标网站的使用规则和版权要求。第三方网站及相机、打印、阅读和分享应用可能适用其各自的条款与隐私政策。<\/p>\n<h2>6. 合理使用<\/h2><p>不得将本应用用于违法活动、侵犯他人权利或未经授权获取、处理及传播他人文档。<\/p>\n<h2>7. 功能调整与可用性<\/h2><p>开发者可能更新、改进或停止提供某些功能。应用兼容性可能受到 Android 版本、系统组件及第三方网站可用性的影响。<\/p>\n<h2>8. 免责声明<\/h2><p>在适用法律允许的范围内，本应用按“现状”提供。开发者不保证 OCR 完全准确、文档边缘检测始终正确，或生成的 PDF 与所有阅读器完全兼容。法律规定不得排除的消费者权利不受影响。<\/p>\n<h2>9. 责任限制<\/h2><p>在适用法律允许的范围内，开发者不对文字识别错误、设备故障、数据损坏或第三方服务引起的间接损失承担责任。法律禁止限制的责任不受本条影响。<\/p>\n<h2>10. 适用法律<\/h2><p>本条款及相关争议受适用法律约束，包括必须遵守的消费者保护规定。<\/p>\n<h2>11. 联系方式及条款变更<\/h2><p>开发者：<strong>[填写开发者姓名或公司法定名称]<\/strong>。邮箱：<a href=\"mailto:YOUR_CONTACT_EMAIL@example.com\">YOUR_CONTACT_EMAIL@example.com<\/a>。条款更新时，修订内容及生效日期将在本页面公布。<\/p><\/main>"};
const TEXT={"ru": {"privacy": "Конфиденциальность", "terms": "Условия использования", "subtitle": "Юридическая информация", "intro": "Ваши документы — под вашим контролем. Ознакомьтесь с правилами работы PhotoPDF.", "version": "Действует с 15 октября 2026", "copy": "Скопировать ссылку", "copied": "Ссылка скопирована", "menu": "Документы", "warning": "Перед публикацией замените контактные данные разработчика и проверьте соответствие политик фактической версии APK."}, "en": {"privacy": "Privacy Policy", "terms": "Terms of Use", "subtitle": "Legal information", "intro": "Your documents stay in your control. Learn how PhotoPDF handles documents and the terms of use.", "version": "Effective October 15, 2026", "copy": "Copy link", "copied": "Link copied", "menu": "Documents", "warning": "Before publishing, replace the developer contact details and verify the policies against the released APK."}, "zh": {"privacy": "隐私政策", "terms": "使用条款", "subtitle": "法律信息", "intro": "您的文档由您掌控。了解 PhotoPDF 如何处理文档及相关使用条款。", "version": "2026 年 10 月 15 日生效", "copy": "复制链接", "copied": "链接已复制", "menu": "法律文件", "warning": "发布前，请填写开发者的真实联系方式，并核对政策与正式发布的 APK 是否一致。"}};
const select=document.getElementById('language');
const buttons=[...document.querySelectorAll('[data-doc]')];
let state={lang:'ru',doc:'privacy'};
function fromHash(){
  const match=location.hash.match(/^#(ru|en|zh)-(privacy|terms)$/);
  if(match)return {lang:match[1],doc:match[2]};
  return null;
}
function render(push=false){
  const t=TEXT[state.lang];
  document.documentElement.lang=state.lang==='zh'?'zh-CN':state.lang;
  select.value=state.lang;
  document.getElementById('subtitle').textContent=t.subtitle;
  document.getElementById('intro').textContent=t.intro;
  document.getElementById('version').textContent=t.version;
  document.getElementById('copy').textContent=t.copy;
  document.getElementById('warning').textContent=t.warning;
  document.getElementById('footerText').textContent=t.subtitle;
  for(const b of buttons){
    b.textContent=t[b.dataset.doc];
    b.setAttribute('aria-selected',String(b.dataset.doc===state.doc));
    b.tabIndex=b.dataset.doc===state.doc?0:-1;
  }
  const panel=document.getElementById('content');
  panel.innerHTML=CONTENT[state.lang+'-'+state.doc];
  panel.setAttribute('aria-labelledby',state.doc+'-tab');
  document.title=t[state.doc]+' | PhotoPDF';
  const hash='#'+state.lang+'-'+state.doc;
  if(location.hash!==hash){
    if(push)history.pushState(null,'',hash);
    else history.replaceState(null,'',hash);
  }
  try{localStorage.setItem('photopdf-legal-lang',state.lang);}catch(e){}
}
function switchTo(doc,lang){
  const changed=state.doc!==doc||state.lang!==lang;
  state={doc,lang};
  render(changed);
}
buttons.forEach(b=>b.addEventListener('click',()=>switchTo(b.dataset.doc,state.lang)));
select.addEventListener('change',e=>switchTo(state.doc,e.target.value));
window.addEventListener('hashchange',()=>{const s=fromHash();if(s){state=s;render();}});
window.addEventListener('popstate',()=>{const s=fromHash();if(s){state=s;render();}});
document.getElementById('copy').addEventListener('click',async()=>{
  try{
    await navigator.clipboard.writeText(location.href);
    const b=document.getElementById('copy');b.textContent=TEXT[state.lang].copied;
    b.blur();
  }catch(e){window.prompt('Copy URL',location.href);}
});
let stored='ru';try{stored=localStorage.getItem('photopdf-legal-lang')||'ru';}catch(e){}
state=fromHash()||{lang:TEXT[stored]?stored:'ru',doc:'privacy'};
render();
</script></body></html>
