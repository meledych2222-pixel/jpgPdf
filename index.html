const CONTENT={"ru-privacy":"<main><h1>Политика конфиденциальности<\/h1><p class=\"meta\">Приложение: Фото и веб-страницы в PDF · Пакет Android: <code>com.photopdf.app<\/code> · Дата вступления в силу: 15 октября 2026 г.<\/p>\n<h2>1. Кто отвечает за обработку данных<\/h2><p>Оператор приложения Фото и веб-страницы в PDF: <strong>Chigrakova Anastasiia<\/strong>. Контакт для обращений по вопросам конфиденциальности: <a href=\"mailto:meledy11@yandex.ru\">meledy11@yandex.ru<\/a>.<\/p>\n<h2>2. Какие данные обрабатывает приложение<\/h2><p>Фото и веб-страницы в PDF позволяет выбирать изображения и PDF-файлы, получать фотографии через системное приложение камеры, обрезать и редактировать страницы, распознавать текст (OCR) и создавать PDF-документы. Для этих функций приложение обрабатывает выбранные вами изображения, текст, координаты обрезки, настройки страниц и создаваемые документы.<\/p><p>При выборе файлов используются системные механизмы Android. Фото и веб-страницы в PDF получает доступ к файлам, которые вы выбираете, или к снимкам, которые создаёте для обработки.<\/p>\n<h2>3. Локальная обработка и OCR<\/h2><p>В рассматриваемой версии распознавание текста выполняется на устройстве с помощью встроенных OCR-моделей. Для распознавания изображений не требуется отправлять документы на сервер разработчика. Готовые PDF сохраняются в место, выбранное пользователем.<\/p><p>Если OCR не распознаёт текст или возникает ошибка, приложение может создать PDF, содержащий изображения страниц без выделяемого текстового слоя.<\/p>\n<h2>4. Интернет и веб-страницы<\/h2><p>Функция «Веб-страница в PDF» использует встроенный WebView для загрузки указанного вами сайта. При посещении сайта ваше устройство взаимодействует с его сервером; сайт может получать IP-адрес, технические сведения, cookie и другие данные согласно собственной политике. Фото и веб-страницы в PDF не контролирует практики сторонних сайтов.<\/p><p>Встроенный WebView может сохранять данные сайта, например cookie или локальное хранилище, в пределах механизмов Android WebView.<\/p>\n<h2>5. Передача и совместное использование<\/h2><p>Фото и веб-страницы в PDF позволяет открыть или отправить созданный PDF через выбранное вами стороннее приложение. При таком действии документ передаётся указанному приложению, и к нему применяются правила соответствующего сервиса.<\/p><p>Приложение также может вызывать системную камеру, просмотрщик PDF и интерфейс печати Android; эти компоненты могут обрабатывать данные в соответствии со своими правилами.<\/p>\n<h2>6. Реклама, аналитика и учётные записи<\/h2><p>В приложении интегрирован Huawei Ads SDK (Petal Ads) для показа рекламы. При запросе и показе рекламы Huawei и её партнёры могут обрабатывать IP-адрес, технические характеристики устройства, рекламные идентификаторы (если доступны), приблизительное местоположение, сведения о показах и взаимодействиях с рекламой. Конкретный состав данных зависит от устройства, региона, настроек и предоставленного согласия. Для персонализированной рекламы применяется соответствующее согласие пользователя, когда оно требуется законом. Доступность рекламы зависит от одобрения сервиса и региона. Подробнее об обработке данных Huawei см. <a href=\"https://consumer.huawei.com/en/privacy/privacy-policy/\" rel=\"noopener noreferrer\" target=\"_blank\">политику конфиденциальности Huawei<\/a>. При отсутствии согласия персонализированная реклама не должна запрашиваться; отдельные неперсонализированные объявления могут отображаться, если это допускается законом и настройками SDK. В приложении не требуется создавать учётную запись разработчика.<\/p>\n<h2>7. Хранение и удаление<\/h2><p>Выбранные исходные файлы обычно остаются в исходном месте. Созданные PDF сохраняются в выбранной вами папке. Временные файлы обработки могут создаваться в кэше приложения и удаляться после завершения операции; некоторые временные данные могут сохраняться до очистки кэша системой или пользователем. Снимки, сделанные через системную камеру, могут сохраняться в медиахранилище устройства.<\/p><p>Вы можете удалить сохранённые документы через файловый менеджер и очистить данные приложения через настройки Android. Удаление приложения не обязательно удаляет файлы, сохранённые вне его приватного хранилища.<\/p>\n<h2>8. Безопасность<\/h2><p>Приложение использует механизмы доступа к файлам и изоляции приложений Android. Ни одно программное обеспечение не может гарантировать абсолютную безопасность; рекомендуем защищать устройство паролем и осторожно делиться конфиденциальными документами.<\/p>\n<h2>9. Дети<\/h2><p>Фото и веб-страницы в PDF — универсальный инструмент обработки документов и не предназначен специально для детей. Если вы считаете, что приложение обрабатывает персональные данные ребёнка ненадлежащим образом, обратитесь по контактному адресу.<\/p>\n<h2>10. Ваши права и обращения<\/h2><p>В зависимости от применимого законодательства вы можете иметь права на получение информации об обработке данных, доступ, исправление или удаление данных и подачу жалобы в надзорный орган. Для вопросов о работе приложения и обработке данных свяжитесь с разработчиком по указанному адресу.<\/p>\n<h2>11. Изменения политики<\/h2><p>Мы можем обновлять эту политику при изменении функций приложения или законодательства. Актуальная версия публикуется на этой странице с новой датой вступления в силу.<\/p><\/main>","ru-terms":"<main><h1>Условия использования<\/h1><p class=\"meta\">Приложение: Фото и веб-страницы в PDF · Дата вступления в силу: 15 октября 2026 г.<\/p>\n<h2>1. Принятие условий<\/h2><p>Устанавливая и используя Фото и веб-страницы в PDF, вы соглашаетесь с настоящими условиями в той мере, в какой это допускается применимым законодательством. Если вы не согласны, прекратите использование приложения.<\/p>\n<h2>2. Назначение приложения<\/h2><p>Фото и веб-страницы в PDF предназначен для преобразования изображений в PDF, сканирования и обрезки документов, коррекции страниц, распознавания текста, а также создания PDF из веб-страниц с помощью возможностей Android. Наличие и качество отдельных функций зависит от версии приложения, устройства и исходных материалов.<\/p>\n<h2>3. Ваши файлы и права<\/h2><p>Вы сохраняете права на свои изображения, документы и создаваемые материалы. Вы обязуетесь использовать только материалы, на обработку которых у вас есть необходимые права и разрешения. Разработчик не приобретает права собственности на содержимое ваших документов вследствие их обработки в приложении.<\/p>\n<h2>4. OCR и точность документов<\/h2><p>Распознавание текста может допускать ошибки, пропускать символы и некорректно определять расположение текста. В некоторых случаях PDF будет содержать только изображения, без возможности выделять текст. Проверяйте важные документы перед отправкой, печатью или использованием в юридических, медицинских, финансовых и иных значимых целях.<\/p>\n<h2>5. Веб-сайты и сторонние сервисы<\/h2><p>При использовании функции преобразования веб-страницы вы несёте ответственность за соблюдение правил посещаемого сайта и авторских прав. Внешние сайты, системные приложения камеры, печати, просмотра и обмена файлами регулируются собственными условиями и политиками.<\/p>\n<h2>6. Допустимое использование<\/h2><p>Запрещается использовать приложение для действий, нарушающих закон, права третьих лиц или безопасность информационных систем. Не используйте приложение для несанкционированного получения или распространения чужих документов.<\/p>\n<h2>7. Доступность и обновления<\/h2><p>Разработчик может изменять, улучшать или прекращать отдельные функции. Работа приложения может зависеть от версии Android, системных компонентов и доступности внешних сайтов.<\/p>\n<h2>8. Отказ от гарантий<\/h2><p>В пределах, допускаемых законом, приложение предоставляется «как есть». Разработчик не гарантирует безошибочную работу OCR, абсолютную точность определения границ документа или совместимость каждого созданного PDF со всеми сторонними программами. Обязательные права потребителя, предусмотренные законом, сохраняются.<\/p>\n<h2>9. Ограничение ответственности<\/h2><p>В пределах, допускаемых применимым законодательством, разработчик не отвечает за косвенные убытки, возникшие вследствие ошибок распознавания, повреждения исходных данных, сбоев устройства или использования сторонних сервисов. Это положение не исключает ответственность, которую нельзя ограничить законом.<\/p>\n<h2>10. Применимое законодательство<\/h2><p>К настоящим условиям применяется законодательство, применимое к разработчику и пользователю с учётом обязательных норм о защите прав потребителей. Споры решаются в соответствии с применимым законодательством.<\/p>\n<h2>11. Контакты и изменения<\/h2><p>Разработчик: <strong>Chigrakova Anastasiia<\/strong>. Контакт: <a href=\"mailto:meledy11@yandex.ru\">meledy11@yandex.ru<\/a>. При изменении условий обновлённая редакция и дата её вступления в силу будут размещены на этой странице.<\/p><\/main>","en-privacy":"<main><h1>Privacy Policy<\/h1><p class=\"meta\">App: Photo &amp; Web to PDF · Android package: <code>com.photopdf.app<\/code> · Effective date: October 15, 2026<\/p>\n<h2>1. Controller and contact<\/h2><p>App developer/controller: <strong>Chigrakova Anastasiia<\/strong>. Privacy contact: <a href=\"mailto:meledy11@yandex.ru\">meledy11@yandex.ru<\/a>.<\/p>\n<h2>2. Information processed<\/h2><p>Photo &amp; Web to PDF processes images, documents, recognized text, crop coordinates and page settings that you choose to use for scanning, editing, OCR and PDF creation. Android system file pickers and camera intents are used to access user-selected content.<\/p>\n<h2>3. On-device OCR<\/h2><p>In the reviewed Stage 20 source code, OCR runs on the device using bundled language data. Document images do not need to be uploaded to a developer server for OCR. PDF files are saved to locations selected by the user. If OCR fails, the app may create image-only PDFs without selectable text.<\/p>\n<h2>4. Websites and internet access<\/h2><p>The web-to-PDF feature uses Android WebView to load websites you choose. Websites may receive your IP address, device/browser information and cookies and may use their own tracking technologies. Third-party sites are governed by their own privacy policies. WebView may retain cookies or site storage through Android's WebView mechanisms.<\/p>\n<h2>5. Sharing and third parties<\/h2><p>When you share, print or open a document using another app, the content is provided to the app or service you select. System camera, printing and PDF viewing components may also process content under their own terms.<\/p>\n<h2>6. Ads, analytics and accounts<\/h2><p>The app integrates Huawei Ads SDK (Petal Ads) for advertising. When ads are requested or displayed, Huawei and its partners may process IP addresses, device technical characteristics, advertising identifiers (where available), approximate location, and ad impression and interaction information. The precise data depends on device, region, settings, and consent. Consent is obtained for personalized advertising where required by law. Ad availability depends on service approval and region. For more information, see the <a href=\"https://consumer.huawei.com/en/privacy/privacy-policy/\" rel=\"noopener noreferrer\" target=\"_blank\">Huawei Privacy Policy<\/a>. Personalized ads should not be requested without required consent; non-personalized ads may still appear where permitted by law and SDK settings. No developer-operated account registration is required.<\/p>\n<h2>7. Retention and deletion<\/h2><p>Original files normally remain in their original locations. Exported PDFs are saved where you choose. Temporary processing files may be stored in app cache and deleted after processing or when cache is cleared. Photos captured through the system camera may remain in device media storage. Uninstalling the app may not delete files saved outside private app storage.<\/p>\n<h2>8. Security and children<\/h2><p>Photo &amp; Web to PDF relies on Android file-access and app-isolation mechanisms. No software can guarantee perfect security. The app is not specifically directed to children.<\/p>\n<h2>9. Your rights<\/h2><p>Depending on applicable law, you may have rights to access, correct or delete personal information and to contact a regulator. Contact the developer using the email above with privacy questions.<\/p>\n<h2>10. Updates<\/h2><p>This policy may change as the app or legal requirements change. The current version and its effective date will be published here.<\/p><\/main>","en-terms":"<main><h1>Terms of Use<\/h1><p class=\"meta\">App: Photo &amp; Web to PDF · Effective date: October 15, 2026<\/p>\n<h2>1. Acceptance<\/h2><p>By installing or using Photo &amp; Web to PDF, you agree to these terms to the extent permitted by applicable law. If you disagree, stop using the app.<\/p>\n<h2>2. Service<\/h2><p>Photo &amp; Web to PDF provides image-to-PDF conversion, document cropping and adjustment, OCR, and web-to-PDF functionality using Android features. Availability and quality depend on the app version, device and source material.<\/p>\n<h2>3. Your content<\/h2><p>You retain ownership of your documents and images. You are responsible for having the necessary rights to process or share them. The developer does not obtain ownership of your documents merely because you process them in the app.<\/p>\n<h2>4. OCR accuracy<\/h2><p>OCR may misrecognize, omit or misplace text. Some generated PDFs may be image-only, with no selectable text. Check important files before relying on them for legal, medical, financial or other consequential purposes.<\/p>\n<h2>5. Third-party services<\/h2><p>You are responsible for complying with the rules and copyrights of websites converted to PDF. Websites and third-party camera, print, viewer and sharing apps have their own terms and policies.<\/p>\n<h2>6. Acceptable use<\/h2><p>Do not use the app unlawfully, infringe others' rights, or process and distribute documents without authorization.<\/p>\n<h2>7. Changes and const select=document.getElementById('language');
const buttons=[...document.querySelectorAll('[data-doc]')];
let state={lang:'ru',doc:'privacy'};
function fromHash(){
  const match=location.hash.match(/^#(ru|en|zh)-(privacy|terms|eula)$/);
  if(match)return {lang:match[1],doc:match[2]};
  return null;
}
function render(push=false){
  const t=TEXT[state.lang];
  document.documentElement.lang=state.lang==='zh'?'zh-CN':state.lang;
  select.value=state.lang;
  document.getElementById('subtitle').textContent=t.subtitle;
document.getElementById('appTitle').textContent={
  ru:'Фото и веб-страницы в PDF',
  en:'Photo & Web to PDF',
  zh:'图片和网页转PDF'
}[state.lang];
document.getElementById('appTitle').textContent={
  ru:'Фото и веб-страницы в PDF',
  en:'Photo & Web to PDF',
  zh:'图片和网页转PDF'
}[state.lang];
  document.getElementById('intro').textContent=t.intro;
  document.getElementById('version').textContent=t.version;
  document.getElementById('copy').textContent=t.copy;
  document.getElementById('warning').textContent=t.warning;
  document.getElementById('footerText').textContent=t.subtitle;
  for(const b of buttons){
    b.textContent=t[b.dataset.doc];
    b.setAttribute('aria-selected',String(b.dataset.doc===state.doc));
    b.tabIndex=b.dataset.doc===state.doc?0:-1;
  }
  const panel=document.getElementById('content');
  panel.innerHTML=CONTENT[state.lang+'-'+state.doc];
  panel.setAttribute('aria-labelledby',state.doc+'-tab');
  document.title=t[state.doc]+' | '+({ru:'Фото и веб-страницы в PDF',en:'Photo & Web to PDF',zh:'图片和网页转PDF'}[state.lang]);
  const hash='#'+state.lang+'-'+state.doc;
  if(location.hash!==hash){
    if(push)history.pushState(null,'',hash);
    else history.replaceState(null,'',hash);
  }
  try{localStorage.setItem('photopdf-legal-lang',state.lang);}catch(e){}
}
function switchTo(doc,lang){
  const changed=state.doc!==doc||state.lang!==lang;
  state={doc,lang};
  render(changed);
}
buttons.forEach(b=>b.addEventListener('click',()=>switchTo(b.dataset.doc,state.lang)));
select.addEventListener('change',e=>switchTo(state.doc,e.target.value));
window.addEventListener('hashchange',()=>{const s=fromHash();if(s){state=s;render();}});
window.addEventListener('popstate',()=>{const s=fromHash();if(s){state=s;render();}});
document.getElementById('copy').addEventListener('click',async()=>{
  try{
    await navigator.clipboard.writeText(location.href);
    const b=document.getElementById('copy');b.textContent=TEXT[state.lang].copied;
    b.blur();
  }catch(e){window.prompt('Copy URL',location.href);}
});
let stored='ru';try{stored=localStorage.getItem('photopdf-legal-lang')||'ru';}catch(e){}
state=fromHash()||{lang:TEXT[stored]?stored:'ru',doc:'privacy'};
render();
</script></body></html>
